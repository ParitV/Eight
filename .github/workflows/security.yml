name: Security Scans

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          source-root: target-app

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"
          output: codeql-results

      - name: Upload CodeQL SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: codeql-results/*.sarif
          retention-days: 7

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan --config auto --sarif --output semgrep-results.sarif target-app/
        continue-on-error: true

      - name: Upload Semgrep SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep-results.sarif
          retention-days: 7

  zap-dast:
    name: OWASP ZAP Baseline (DAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build target-app Docker image
        run: docker build -t target-app:ci ./target-app

      - name: Run target-app container
        run: docker run -d --name target-app -p 8080:8080 target-app:ci

      - name: Wait for target-app to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sSf http://localhost:8080/ > /dev/null; then
              echo "target-app is up"
              exit 0
            fi
            echo "Waiting for target-app... (attempt $i)"
            sleep 2
          done
          echo "target-app did not become ready in time"
          docker logs target-app
          exit 1

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:8080'
          cmd_options: '-J report_json.json'
          fail_action: false
          allow_issue_writing: false

      - name: Upload ZAP report artifact
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            report_html.html
            report_md.md
            report_json.json
          retention-days: 7
